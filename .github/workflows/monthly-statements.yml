# Builds last month's partner statements as drafts for finance, at 07:17 Lagos time on the 1st of
# each month (06:17 UTC; Lagos is UTC+1 all year). Safe to run again by hand from the Actions tab:
# a second run only adds visits not on a statement yet. Skips quietly until JOBS_SECRET is set.
name: Monthly partner statements (staging)

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    environment: staging
    env:
      JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
      API_URL: https://intu-api-staging.vercel.app
    steps:
      - name: Build last month's statements
        run: |
          if [ -z "$JOBS_SECRET" ]; then
            echo "::warning::Not running: add the JOBS_SECRET secret under Settings → Environments → staging, and the same value on the API"
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$API_URL/jobs/settlements" -H "authorization: Bearer $JOBS_SECRET" -H "content-type: application/json"
