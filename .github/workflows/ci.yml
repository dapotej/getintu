name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets anyone with access re-run everything from the Actions tab.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/intu
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Admin console end to end: real API, real Postgres, Supabase Auth faked in the browser.
  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/intu
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @intu/admin exec playwright install --with-deps chromium
      - run: pnpm --filter @intu/admin test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: apps/admin/playwright-report
          retention-days: 7

  # Applies new migrations to the Supabase staging database after checks pass on main.
  # Skips quietly until the STAGING_DATABASE_URL repository secret exists.
  migrate-staging:
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - name: Check for the staging secret
        id: secret
        run: echo "present=$([ -n "$DATABASE_URL" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.secret.outputs.present == 'true'
      - uses: pnpm/action-setup@v5
        if: steps.secret.outputs.present == 'true'
      - uses: actions/setup-node@v6
        if: steps.secret.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.secret.outputs.present == 'true'
      - run: pnpm db:migrate
        if: steps.secret.outputs.present == 'true'
