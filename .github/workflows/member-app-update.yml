# Publishes the member app to the staging channel of intu's Expo project, so it opens in the Expo
# Go app on a phone. Runs after a push to main that changes the app or the code it shares, and by
# hand from the Actions tab. Skips quietly until EXPO_TOKEN and the EXPO_PROJECT_ID variable exist.
name: Member app to Expo Go (staging)

on:
  push:
    branches: [main]
    paths:
      - "apps/member/**"
      - "packages/qr/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: staging
    # Each setting may be saved as a secret or a variable, on the staging environment or the repository.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID || secrets.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER || secrets.EXPO_OWNER }}
      EXPO_PUBLIC_API_URL: https://intu-api-staging.vercel.app
      EXPO_PUBLIC_APP_VERSION: ${{ github.sha }}
      EXPO_PUBLIC_SUPABASE_URL: https://xokexyqjlydjqquownvw.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check Expo is set up
        id: expo
        run: |
          missing=""
          for name in EXPO_TOKEN EXPO_PROJECT_ID EXPO_OWNER EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Not publishing: missing$missing (add them under Settings → Environments → staging)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "All Expo settings found."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.expo.outputs.ready == 'true'
      - uses: pnpm/action-setup@v5
        if: steps.expo.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.expo.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.expo.outputs.ready == 'true'
      - name: Publish an update to the staging channel
        if: steps.expo.outputs.ready == 'true'
        working-directory: apps/member
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Manual publish' }}
        run: npx --yes eas-cli@24.12.1 update --branch staging --message "$(printf '%s' "$MESSAGE" | head -n 1)" --platform all --non-interactive
